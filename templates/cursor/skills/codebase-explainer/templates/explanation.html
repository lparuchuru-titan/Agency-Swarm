<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #0f1419; --surface: #1a2332; --border: #2d3a4f;
      --text: #e8edf4; --muted: #8fa3b8; --accent: #5b9cf5;
      --green: #34d399; --yellow: #fbbf24; --purple: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
    }
    header {
      padding: 1.5rem 2rem; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    h1 { margin: 0 0 .35rem; font-size: 1.5rem; }
    .meta { color: var(--muted); font-size: .85rem; }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }
    section { margin-bottom: 2rem; }
    h2 {
      font-size: 1.1rem; margin: 0 0 .75rem; color: var(--accent);
      border-bottom: 1px solid var(--border); padding-bottom: .35rem;
    }
    h3 { font-size: .95rem; margin: 1rem 0 .5rem; color: var(--purple); }
    p { margin: .5rem 0; }
    ul, ol { margin: .5rem 0; padding-left: 1.25rem; }
    .summary {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem 1.25rem;
    }
    .callout {
      border-left: 3px solid var(--accent); padding: .75rem 1rem;
      background: rgba(91,156,245,.08); margin: .75rem 0; border-radius: 0 8px 8px 0;
    }
    table {
      width: 100%; border-collapse: collapse; font-size: .9rem;
      background: var(--surface); border-radius: 8px; overflow: hidden;
    }
    th, td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; }
    th { background: rgba(255,255,255,.04); color: var(--muted); font-size: .75rem; text-transform: uppercase; }
    code { background: rgba(255,255,255,.06); padding: .1rem .35rem; border-radius: 4px; font-size: .88em; }
    pre {
      background: #0b1018; border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem; overflow-x: auto; font-size: .82rem; line-height: 1.45;
    }
    pre code { background: none; padding: 0; }
    .source-link { color: var(--accent); text-decoration: none; }
    .source-link:hover { text-decoration: underline; }
    .tag {
      display: inline-block; font-size: .7rem; font-weight: 600;
      padding: .15rem .5rem; border-radius: 4px; margin-right: .35rem;
      background: rgba(167,139,250,.15); color: var(--purple);
    }
    footer {
      text-align: center; color: var(--muted); font-size: .75rem;
      padding: 1rem; border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>{{TITLE}}</h1>
    <div class="meta">Generated {{TIMESTAMP}} · {{PROJECT}}</div>
  </header>
  <main>
    <section id="question">
      <h2>Your question</h2>
      <p>{{QUESTION}}</p>
    </section>

    <section id="summary">
      <h2>Executive summary</h2>
      <div class="summary">{{EXEC_SUMMARY}}</div>
    </section>

  <!-- AGENT: duplicate <section> blocks below for each major finding area -->
    <section id="code">
      <h2>Codebase</h2>
      <!-- paths, snippets, flow explanation -->
    </section>

    <section id="jira">
      <h2>Jira</h2>
      <!-- tickets, acceptance criteria, links -->
    </section>

    <section id="confluence">
      <h2>Confluence</h2>
      <!-- page summaries -->
    </section>

    <section id="google">
      <h2>Google Drive &amp; Sheets</h2>
      <!-- doc/sheet findings -->
    </section>

    <section id="local-docs">
      <h2>Local documentation</h2>
      <!-- docs/, runbooks, README -->
    </section>

    <section id="sources">
      <h2>Sources</h2>
      <table>
        <thead><tr><th>Type</th><th>Title</th><th>Link / path</th></tr></thead>
        <tbody>{{SOURCES_ROWS}}</tbody>
      </table>
    </section>
  </main>
  <footer>Generated by codebase-explainer skill</footer>
</body>
</html>
